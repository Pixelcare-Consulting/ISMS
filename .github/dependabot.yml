version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-patch-minor:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 3
    groups:
      github-actions-patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor

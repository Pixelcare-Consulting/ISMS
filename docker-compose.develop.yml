# DEVELOP override — your laptop (or a throwaway dev box). Tracks the `develop` branch.
#
#   deploy/stack.sh develop up -d --build          # full stack, app on http://localhost:3000
#   deploy/stack.sh develop up -d postgres         # DB only, then `pnpm dev` on the host
#   APP_IMAGE=ghcr.io/pixelcare-consulting/isms:develop deploy/stack.sh develop up -d --pull always
#
# Differences from staging: builds the image from the working tree by
# default, no Traefik/TLS (port 3000 published directly), cron is opt-in
# (`--profile cron`) so a laptop never hammers SAP by accident.
name: isms-develop

x-env-file: &env-file .env.develop

services:
  migrator:
    image: ${APP_IMAGE:-isms:develop}
    build: &app-build
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    env_file: [*env-file]

  app:
    image: ${APP_IMAGE:-isms:develop}
    build: *app-build
    env_file: [*env-file]
    ports:
      - "${APP_HOST_PORT:-3000}:3000"

  cron:
    profiles: ["cron"]
    env_file: [*env-file]

volumes:
  postgres-data:
    # Adopt the volume the old docker-compose.yml created (isms/isms/isms) so
    # existing local data survives the switch.
    name: isms_pg_data

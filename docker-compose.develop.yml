# DEVELOP override — Finden server, behind the shared Traefik.
#
#   deploy/stack.sh develop up -d
#
# The internal-testing environment: every merge into the `develop` branch is
# deployed here automatically so the team can try changes on a real URL.
# Image: always a published GHCR tag (built by CI from `develop`), never built
# here. To run the stack on your own machine instead, use the sandbox override.
name: isms-develop

x-env-file: &env-file .env.develop

services:
  migrator:
    image: ${APP_IMAGE:?APP_IMAGE must be a published image, e.g. ghcr.io/pixelcare-consulting/isms:sha-…}
    env_file: [*env-file]

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be a published image, e.g. ghcr.io/pixelcare-consulting/isms:sha-…}
    env_file: [*env-file]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.isms-develop.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.develop}`)
      - traefik.http.routers.isms-develop.entrypoints=websecure
      - traefik.http.routers.isms-develop.tls.certresolver=letsencrypt
      - traefik.http.services.isms-develop.loadbalancer.server.port=3000
    networks:
      - internal
      - traefik-public

  cron:
    env_file: [*env-file]

networks:
  traefik-public:
    external: true

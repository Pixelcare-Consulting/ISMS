# PRODUCTION override — Finden server, behind the shared Traefik.
#
#   deploy/stack.sh production up -d
#
# Same topology as staging plus nightly Postgres dumps into ./backups/postgres.
# Image: only builds of the `production` branch, promoted by the deploy workflow.
name: isms-production

x-env-file: &env-file .env.production

services:
  migrator:
    image: ${APP_IMAGE:?APP_IMAGE must be a published image, e.g. ghcr.io/pixelcare-consulting/isms:sha-…}
    env_file: [*env-file]

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be a published image, e.g. ghcr.io/pixelcare-consulting/isms:sha-…}
    env_file: [*env-file]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.isms-production.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env.production}`)
      - traefik.http.routers.isms-production.entrypoints=websecure
      - traefik.http.routers.isms-production.tls.certresolver=letsencrypt
      - traefik.http.services.isms-production.loadbalancer.server.port=3000
    networks:
      - internal
      - traefik-public

  cron:
    env_file: [*env-file]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

networks:
  traefik-public:
    external: true

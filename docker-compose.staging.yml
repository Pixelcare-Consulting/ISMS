name: isms-staging

services:
  traefik:
    image: traefik:v3.1
    container_name: isms-traefik-staging
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - staging-network

  postgres:
    image: postgres:16-alpine
    container_name: isms-postgres-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      # this ports should be different from the prod
      - "127.0.0.1:5432:5432"
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  redis:
    image: redis:8-alpine
    container_name: isms-redis-staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  migrator:
    image: ${APP_IMAGE:?Set APP_IMAGE to the immutable application image}
    restart: "no"
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks:
      - staging-network

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the immutable application image}
    container_name: isms-portal-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.isms-staging.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.isms-staging.entrypoints=web
      - traefik.http.services.isms-staging.loadbalancer.server.port=3000
    networks:
      - staging-network

volumes:
  staging-postgres-data:
  staging-redis-data:

networks:
  staging-network:
    driver: bridge
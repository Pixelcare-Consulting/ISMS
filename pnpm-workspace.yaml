overrides:
  zod: ^4.4.3
  # Security floors for transitive deps whose parents haven't shipped a fix yet
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0
  exceljs>uuid: ^11.1.1
  # js-yaml@3 drags in argparse@1 → sprintf-js (unpatched DoS); v4's load() is compatible
  '@istanbuljs/load-nyc-config>js-yaml': ^4.3.2
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
